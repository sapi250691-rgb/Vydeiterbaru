<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player Videy</title>

    <!-- Skrip Iklan Popunder Adsterra -->
    <script src="https://thewilddetail.com/d8/8e/b3/d88eb3d0170ef3478f8f44203ace8da9.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Tampilan Pemutar Video Layar Penuh HP */
        .video-wrapper {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .video-container {
            width: 100%;
            height: 100%;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Pop-up Konfirmasi Umur */
        .age-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .age-modal-box {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px 20px;
            max-width: 350px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
        }

        .age-modal-box h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #ff4757;
        }

        .age-modal-box p {
            font-size: 14px;
            color: #cccccc;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .age-btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            background: #ff4757;
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <div class="video-container">
            <iframe
                src="https://videy.co/v/?id=HnJX4Ask1"
                title="Videy Video Player"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen
                scrolling="no">
            </iframe>
        </div>
    </div>

    <!-- Modal Konfirmasi Umur -->
    <div class="age-modal-overlay" id="ageModal">
        <div class="age-modal-box">
            <h2>Konfirmasi Umur</h2>
            <p>Konten ini memerlukan verifikasi usia. Lanjutkan jika Anda sudah berusia 18 tahun ke atas.</p>
            <button class="age-btn" id="confirmAgeBtn">Saya Berusia 18+</button>
        </div>
    </div>

    <script>
        const SMARTLINK_URL = "https://thewilddetail.com/z02a1bxd?key=f48d1b3a91d0b1fd3db51c3c384a044b";
        const SOCIAL_BAR_SRC = "https://thewilddetail.com/0b/28/3b/0b283b590e4a16de38f299a6ffe16906.js";

        // Tampilkan konfirmasi umur setelah 3 detik
        setTimeout(() => {
            document.getElementById('ageModal').style.display = 'flex';
        }, 3000);

        // Aksi tombol konfirmasi umur
        document.getElementById('confirmAgeBtn').addEventListener('click', function() {
            // 1. Buka Smartlink
            window.open(SMARTLINK_URL, '_blank');

            // 2. Tutup jendela konfirmasi
            document.getElementById('ageModal').style.display = 'none';

            // 3. Muat skrip Social Bar Adsterra
            loadSocialBar();
        });

        function loadSocialBar() {
            if (!document.getElementById('socialBarScript')) {
                const script = document.createElement('script');
                script.id = 'socialBarScript';
                script.src = SOCIAL_BAR_SRC;
                document.body.appendChild(script);
            }
        }
    </script>

</body>
</html>
