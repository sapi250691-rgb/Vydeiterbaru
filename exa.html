
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Player Videy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #111;
            font-family: Arial, sans-serif;
        }

        .video-wrapper {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        .video-container iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-title {
            color: white;
            text-align: center;
            font-size: 18px;
            padding: 15px;
            background: #1c1c1c;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .video-title {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="video-wrapper">

        <div class="video-container">
            <iframe
                src="https://videy.co/v/?id=HnJX4Ask1"
                title="Videy Video Player"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen
                scrolling="no">
            </iframe>
        </div>

        <div class="video-title">
            Video Player
        </div>

    </div>

</body>
</html>
