    <title>Katalog Pemutar Video</title>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        .video-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        .video-card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #e0e0e0;
        }
        .video-player-link {
            display: block;
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Rasio aspek 16:9 */
            background-color: #000000;
            border-radius: 8px;
            overflow: hidden;
            text-decoration: none;
            margin-bottom: 12px;
            border: 1px solid #333;
        }
        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px;
            height: 65px;
            background-color: rgba(229, 9, 20, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .play-button::after {
            content: "";
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 12px 0 12px 20px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 4px;
        }
        .video-player-link:hover .play-button {
            transform: translate(-50%, -50%) scale(1.1);
            background-color: #ff0f1a;
        }
        .btn-smartlink {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #e50914;
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: background-color 0.3s ease;
        }
        .btn-smartlink:hover {
            background-color: #b80710;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ================= VIDEO 1 ================= -->
        <div class="video-card">
            <h2>Video 1</h2>
            <a href="https://playexa2s.app/f/RMnkD2my" target="_blank" rel="noopener" class="video-player-link">
                <div class="play-button"></div>
            </a>
            <a href="https://thewilddetail.com/hydx4h4uq7?key=83f679db3645c256d0c018ccd75baf96" target="_blank" rel="noopener" class="btn-smartlink">
                🔥 Tonton / Download Kualitas HD
            </a>
        </div>

        <!-- ================= VIDEO 2 ================= -->
